
networks:
  giselef_net:
    driver: bridge

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: giselef_mysql
    restart: always
    environment:
      MYSQL_DATABASE: giselef
      MYSQL_ROOT_PASSWORD: banshkhali  # Match your .env password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - giselef_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pbanshkhali"]
      timeout: 20s
      retries: 10

  # Redis Service (if you want to use local Redis instead of cloud)
  # Uncomment if you want to use local Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: giselef_redis
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - giselef_net

  # API Service
  api:
    image: ${IMAGE_NAMESPACE:-giselef}:${IMAGE_TAG:-v1}
    container_name: giselef_api
    build: .
    ports:
      - "8000:80"
    env_file:
      - .env  # Use your existing .env file
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - giselef_net

volumes:
  mysql_data:
